# PostgreSQL configuration

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  username: postgres
  password: 2552447
  host: localhost
  port: 5432

# Development Database
development:
  <<: *default
  database: book_library_project_development

# Test Database
test:
  <<: *default
  database: book_library_project_test

# Production Databases
production:
  primary: &primary_production
    <<: *default
    database: book_library_project_production
    username: book_library_project
    password: <%= ENV["BOOK_LIBRARY_PROJECT_DATABASE_PASSWORD"] %>

  cache:
    <<: *primary_production
    database: book_library_project_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: book_library_project_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: book_library_project_production_cable
    migrations_paths: db/cable_migrate
